version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0-alpine
    container_name: aams-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-aams_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-secure_password}
      MONGO_INITDB_DATABASE: aams
    ports:
      - "${DB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - aams-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aams-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-redis_password} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aams-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./aams-backend
      dockerfile: Dockerfile
    container_name: aams-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${DB_USER:-aams_user}:${DB_PASS:-secure_password}@mongodb:27017/aams?authSource=admin
      REDIS_URL: redis://:${REDIS_PASS:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:5001
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aams-network
    volumes:
      - ./aams-backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # AI Service (Face Recognition)
  ai-service:
    build:
      context: ./aams-ai
      dockerfile: Dockerfile
    container_name: aams-ai-service
    restart: unless-stopped
    environment:
      PORT: 5001
      REDIS_URL: redis://:${REDIS_PASS:-redis_password}@redis:6379
      MODEL_PATH: /app/models
    ports:
      - "5001:5001"
    depends_on:
      - redis
    networks:
      - aams-network
    volumes:
      - ai_models:/app/models
      - ./aams-ai/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Web App (Optional - if running together)
  # frontend:
  #   build:
  #     context: ./aams-frontend
  #     dockerfile: Dockerfile
  #   container_name: aams-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - aams-network
  #   environment:
  #     VITE_API_URL: http://backend:5000

  # Nginx Reverse Proxy (Optional - for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: aams-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - aams-network

networks:
  aams-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  ai_models:

# Usage:
# 
# Build images:
#   docker-compose build
# 
# Start services:
#   docker-compose up -d
# 
# Stop services:
#   docker-compose down
# 
# View logs:
#   docker-compose logs -f backend
#   docker-compose logs -f ai-service
# 
# Access services:
#   Backend API: http://localhost:5000
#   MongoDB: mongodb://aams_user:secure_password@localhost:27017/aams
#   Redis: redis://localhost:6379
#   AI Service: http://localhost:5001
